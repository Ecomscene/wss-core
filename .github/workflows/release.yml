name: Build release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wss-core.zip
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/wss-core"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='*.zip' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml*' \
            --exclude='phpcs.xml*' \
            --exclude='tests' \
            ./ "$STAGE/wss-core/"
          ( cd "$STAGE" && zip -rq "$GITHUB_WORKSPACE/wss-core.zip" wss-core )
          ls -la "$GITHUB_WORKSPACE/wss-core.zip"

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: wss-core.zip
